# connect the .env file with properties
spring.config.import=optional:file:.env[.properties]

spring.application.name=bookstore

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# make ddl-auto=validate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Neon free tier suspends idle DBs, so keep the pool small and recycle connections
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=30000

server.port=${PORT:8080}
spring.thymeleaf.cache=false

# ==========================================
# Flyway configuration
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# ==========================================
# JWT configuration
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# ==========================================
# JWT cookie configuration
# ==========================================
app.cookie.secure=${COOKIE_SECURE:true}

# ==========================================
# Stripe configuration
# ==========================================
stripe.api.key=${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# FIX: Dynamically maps the environment variables without hardcoding standard text lines inside files
stripe.app.url=${APP_URL:http://localhost:8080}

#=============================================
# Stripe payment urls
#=============================================
stripe.success.url=${stripe.app.url}/checkout/success
stripe.cancel.url=${stripe.app.url}/checkout/cancel

# ADMIN CREDENTIALS
admin.username=${ADMIN_USERNAME}
admin.name=${ADMIN_NAME}
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}
