<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Purchase Details - Admin</title>

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <link rel="stylesheet" th:href="@{/css/style.css(v='1.0.2')}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div th:insert="~{fragments/admin-navbar :: admin-navbar}"></div>

<div class="container mt-4">

    <h2 class="mb-4">Purchase Details</h2>

    <div class="card p-4 mb-4">

        <p>
            <strong>Purchase ID:</strong>
            <span th:text="${purchase.id}">1</span>
        </p>

        <p>
            <strong>Username:</strong>
            <span th:text="${purchase.user.username}">Username</span>
        </p>

        <p>
            <strong>Purchase Date:</strong>
            <span th:text="${purchase.purchaseDate != null
                ? #temporals.format(purchase.purchaseDate, 'dd-MM-yyyy HH:mm')
                : 'N/A'}">Date</span>
        </p>

        <p>
            <strong>Total Amount:</strong>
            ₹<span th:text="${#numbers.formatDecimal(
                purchase.totalAmount, 0, 'COMMA', 2, 'POINT')}">0.00</span>
        </p>

    </div>

    <h4>Items Purchased</h4>

    <div class="table-responsive">
        <table class="table table-bordered table-hover">

            <thead class="table-dark">
                <tr>
                    <th>Book</th>
                    <th>Quantity</th>
                    <th>Price at Purchase (₹)</th>
                    <th>Subtotal (₹)</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="item : ${purchase.items}">

                    <td th:text="${item.book.title}">Book Title</td>

                    <td th:text="${item.quantity}">1</td>

                    <td th:text="${#numbers.formatDecimal(
                        item.priceAtPurchase, 0, 'COMMA', 2, 'POINT')}">
                        0.00
                    </td>

                    <td th:text="${#numbers.formatDecimal(
                        item.priceAtPurchase * item.quantity,
                        0, 'COMMA', 2, 'POINT')}">
                        0.00
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(purchase.items)}">
                    <td colspan="4" class="text-center">
                        No items found for this purchase.
                    </td>
                </tr>

            </tbody>

        </table>
    </div>

    <a th:href="@{/admin/view_purchases}"
       class="btn btn-secondary">
        Back to All Purchases
    </a>

</div>

</body>
</html>
