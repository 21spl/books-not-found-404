<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Canceled</title>
    <style>
        :root {
            --bg-color: #f9fafb;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --warning-color: #f59e0b;
            --primary-btn: #6366f1;
            --primary-btn-hover: #4f46e5;
            --secondary-btn: #e5e7eb;
            --secondary-btn-hover: #d1d5db;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        .icon-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background-color: #fef3c7;
            border-radius: 50%;
            margin-bottom: 24px;
        }

        .icon-container svg {
            width: 32px;
            height: 32px;
            color: var(--warning-color);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 12px 0;
        }

        p {
            font-size: 16px;
            color: var(--text-muted);
            line-height: 1.5;
            margin: 0 0 30px 0;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.1s;
            cursor: pointer;
            border: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--primary-btn);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-btn-hover);
        }

        .btn-secondary {
            background-color: var(--secondary-btn);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: var(--secondary-btn-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Warning / Cancel Exclamation Icon -->
        <div class="icon-container">
            <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
            </svg>
        </div>

        <h1>Order Canceled</h1>
        <p>Your payment session was closed, and no charges were made. If you encountered an issue or changed your mind, you can try checking out again whenever you're ready.</p>

        <div class="button-group">
            <!-- Update the href links to point to your actual routes -->
            <a href="/cart" class="btn btn-primary">Return to Cart</a>
            <a href="/" class="btn btn-secondary">Go to Homepage</a>
        </div>
    </div>

</body>
</html>
