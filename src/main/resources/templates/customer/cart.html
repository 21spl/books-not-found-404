<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Your Cart</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <!-- After editing style.css -->
    <link rel="stylesheet" href="/resources/css/style.css?v=1.0.2">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha512-papcAxPZOkZLKFcV0iM6zzJzX/VCYqu7y7P+MmfQUqsmLSNKJVi2XScqYtQbnUmZUdOHF+xd9oZhxw50YdI0yQ=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.cdnfonts.com/css/segoe-ui-4"
          rel="stylesheet">

    <style>
        /* Neon border and shadow effect */
        .neon-box {
            border: 1px solid #9c27b0;
            box-shadow: 0 0 10px #9c27b0;
            border-radius: 10px;
        }

        /* Quantity Buttons */
        .btn-outline-secondary {
            color: #9c27b0;
            border-color: #9c27b0;
        }

        .btn-outline-secondary:hover {
            background-color: #9c27b0;
            color: #fff;
        }

        /* Success button for checkout */
        .btn-success {
            background-color: #9c27b0;
            border-color: #9c27b0;
        }

        .btn-success:hover {
            background-color: #7b1fa2;
        }

        /* Danger button for remove */
        .btn-danger {
            background-color: #c62828;
            border-color: #c62828;
        }

        .btn-danger:hover {
            background-color: #b71c1c;
        }

        .neon-border {
            border: 2px solid #a259ff;
            box-shadow: 0 0 10px #a259ff44, 0 0 20px #a259ff33;
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .neon-border:hover {
            box-shadow: 0 0 15px #a259ffaa, 0 0 30px #a259ff77;
        }

        .card:hover {
            transform: translateY(-5px);
            transition: transform 0.3s ease;
        }

        .btn-outline-light {
            border-color: #a259ff;
            color: #a259ff;
        }

        .btn-outline-light:hover {
            background-color: #a259ff;
            color: #fff;
        }

        h1 {
            font-family: 'Segoe UI';
            text-align: center;
            font-size: 60px;
            padding-top: 10px;
            padding-bottom: 30px;
            border-bottom: 2px solid #a259ff;
        }

        body {
            background-color: #000000;
            color: #fff;
            font-family: 'Segoe UI';
        }

        .btn-decrease,
        .btn-increase,
        .btn-delete-item,
        .btn-success {
            display: inline-block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
    </style>
</head>

<body style="background-color: #0d0d0d; color: #e0e0e0;">

    <!-- Navbar -->
    <div th:insert="fragments/navbar :: navbar"></div>

    <h1 class="mb-4 pt-4 pb-4 mt-4 mb-4">
        <span>
            <i class="fa-solid fa-cart-shopping"
               style="color: #ffffff;"></i>
        </span>
    </h1>

    <div class="container mt-4">

        <!-- Empty Cart Message -->
        <div th:if="${cartItems == null or #lists.isEmpty(cartItems)}">
            <div class="alert alert-info"
                 style="font-size: 20px; text-align: center; font-weight: bold">
                Your Cart is Empty...
            </div>
        </div>

        <!-- Cart cards -->
        <div th:if="${cartItems != null and !#lists.isEmpty(cartItems)}">

            <div class="row row-cols-1 row-cols-md-2 g-4">

                <div class="col" th:each="item : ${cartItems}">

                    <div class="card h-100 shadow neon-border bg-dark text-white">

                        <div class="card-body">

                            <h5 class="card-title"
                                th:text="${item.book.title}">
                            </h5>

                            <h6 class="card-subtitle mb-2 text-muted"
                                th:text="${item.book.author}">
                            </h6>

                            <p class="card-text item-price">
                                <strong>Price:</strong>
                                ₹<span th:text="${item.book.price}"></span>
                                <br>
                            </p>

                            <p class="card-text item-subtotal">
                                <strong>Total:</strong>
                                ₹<span th:text="${item.quantity * item.book.price}"></span>
                            </p>

                            <!-- Quantity controls -->
                            <div class="d-flex align-items-center">

                                <button type="button"
                                        class="btn btn-sm btn-outline-light btn-decrease"
                                        th:attr="data-item-id=${item.id},
                                                 data-max=${item.book.copies}">
                                    −
                                </button>

                                <input type="text"
                                       th:id="'qty-' + ${item.id}"
                                       class="mx-3 form-control qty-input text-center"
                                       th:value="${item.quantity}"
                                       readonly>

                                <button type="button"
                                        class="btn btn-sm btn-outline-light btn-increase"
                                        th:attr="data-item-id=${item.id},
                                                 data-max=${item.book.copies}">
                                    +
                                </button>

                            </div>

                            <!-- Stock warning -->
                            <div class="text-danger small mt-2"
                                 th:if="${item.quantity > item.book.copies}">
                                Your cart quantity exceeds the displayed stock.
                                Please decrease the quantity before checkout.
                            </div>

                        </div>

                        <!-- Delete item from cart -->
                        <div class="card-footer border-top border-secondary d-flex justify-content-end">

                            <button type="button"
                                    class="btn btn-sm btn-outline-light btn-delete-item"
                                    th:attr="data-item-id=${item.id}">

                                <span>
                                    <i class="fa-solid fa-trash"></i>
                                </span>

                            </button>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Total Price -->
            <div class="mt-5 text-end">
                <h4>
                    Total Amount:
                    ₹<span th:text="${totalAmount}"></span>
                </h4>
            </div>

            <!-- Checkout Button -->
            <div class="text-end mt-3">

                <form th:action="@{/checkout}" method="get">

                    <button type="submit"
                            class="btn btn-success"
                            th:disabled="${hasOutOfStock}">
                        Proceed to Checkout
                    </button>

                </form>

            </div>

            <!-- Optional Warnings (global) -->
            <div th:if="${outOfStockWarnings != null and !#lists.isEmpty(outOfStockWarnings)}"
                 class="alert alert-danger mt-3">

                <ul class="mb-0">
                    <li th:each="msg : ${outOfStockWarnings}"
                        th:text="${msg}">
                    </li>
                </ul>

            </div>

        </div>

    </div>

    <!-- Footer -->
    <div class="footer text-center">
        &copy; 2025 404BooksNotFound &nbsp;|&nbsp; Built with irony, styled with restraint.
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/752b42e49f.js" crossorigin="anonymous"></script>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="text/javascript" th:inline="javascript">
        /*<![CDATA[*/

        document.addEventListener("DOMContentLoaded", function () {

            const csrfTokenElement =
                document.querySelector('meta[name="_csrf"]');

            const csrfHeaderElement =
                document.querySelector('meta[name="_csrf_header"]');

            const csrfToken = csrfTokenElement
                ? csrfTokenElement.content
                : null;

            const csrfHeader = csrfHeaderElement
                ? csrfHeaderElement.content
                : null;

            const pendingItems = new Set();

            /*
             * Send a POST request using the existing controller endpoints.
             */
            function postRequest(url, data) {

                const headers = {
                    'Content-Type': 'application/x-www-form-urlencoded'
                };

                if (csrfToken && csrfHeader) {
                    headers[csrfHeader] = csrfToken;
                }

                const body = new URLSearchParams(data).toString();

                return fetch(url, {
                    method: 'POST',
                    headers: headers,
                    body: body
                }).then(async function (response) {

                    const text = await response.text();

                    if (!response.ok) {
                        throw new Error(
                            text || "The request could not be completed."
                        );
                    }

                    return text;
                });
            }

            /*
             * Update the cart quantity.
             */
            function updateQuantity(itemId, quantity, input, oldQuantity) {

                if (pendingItems.has(itemId)) {
                    return;
                }

                pendingItems.add(itemId);

                const buttons = document.querySelectorAll(
                    '[data-item-id="' + itemId + '"].btn-decrease, ' +
                    '[data-item-id="' + itemId + '"].btn-increase'
                );

                buttons.forEach(function (button) {
                    button.disabled = true;
                });

                postRequest(/*[[@{/cart/update}]]*/ '/cart/update', {
                    itemId: itemId,
                    quantity: quantity
                })
                .then(function () {

                    /*
                     * Reload so that the server recalculates
                     * the cart total and stock status.
                     */
                    window.location.reload();

                })
                .catch(function (error) {

                    input.value = oldQuantity;

                    Swal.fire(
                        "Error",
                        error.message || "Failed to update quantity.",
                        "error"
                    );

                })
                .finally(function () {

                    pendingItems.delete(itemId);

                    buttons.forEach(function (button) {
                        button.disabled = false;
                    });

                });
            }

            /*
             * Increase quantity.
             */
            document.querySelectorAll(".btn-increase")
                .forEach(function (button) {

                    button.addEventListener("click", function () {

                        const itemId = this.getAttribute("data-item-id");

                        if (pendingItems.has(itemId)) {
                            return;
                        }

                        const input = document.getElementById(
                            "qty-" + itemId
                        );

                        const max = parseInt(
                            this.getAttribute("data-max"),
                            10
                        );

                        const current = parseInt(input.value, 10) || 1;

                        if (!Number.isFinite(max) || max < 0) {
                            Swal.fire(
                                "Error",
                                "Unable to determine the displayed stock.",
                                "error"
                            );
                            return;
                        }

                        if (current >= max) {
                            Swal.fire(
                                "Stock Limit",
                                "The requested quantity cannot exceed the displayed stock. " +
                                "Actual availability will be validated by the server.",
                                "warning"
                            );
                            return;
                        }

                        updateQuantity(
                            itemId,
                            current + 1,
                            input,
                            current
                        );

                    });

                });

            /*
             * Decrease quantity.
             */
            document.querySelectorAll(".btn-decrease")
                .forEach(function (button) {

                    button.addEventListener("click", function () {

                        const itemId = this.getAttribute("data-item-id");

                        if (pendingItems.has(itemId)) {
                            return;
                        }

                        const input = document.getElementById(
                            "qty-" + itemId
                        );

                        const current = parseInt(input.value, 10) || 1;

                        if (current > 1) {

                            updateQuantity(
                                itemId,
                                current - 1,
                                input,
                                current
                            );

                        }

                    });

                });

            /*
             * Remove item from cart.
             */
            document.querySelectorAll(".btn-delete-item")
                .forEach(function (button) {

                    button.addEventListener("click", function () {

                        const itemId = this.getAttribute("data-item-id");

                        if (pendingItems.has(itemId)) {
                            return;
                        }

                        Swal.fire({
                            title: 'Are you sure?',
                            text: "Do you want to remove this item from cart?",
                            icon: 'warning',
                            showCancelButton: true,
                            confirmButtonColor: '#9c27b0',
                            cancelButtonColor: '#c62828',
                            confirmButtonText: 'Yes, remove it!'
                        }).then(function (result) {

                            if (!result.isConfirmed) {
                                return;
                            }

                            pendingItems.add(itemId);
                            button.disabled = true;

                            postRequest(/*[[@{/cart/remove}]]*/ '/cart/remove', {
                                itemId: itemId
                            })
                            .then(function () {

                                Swal.fire(
                                    "Removed!",
                                    "Item removed from cart.",
                                    "success"
                                ).then(function () {
                                    window.location.reload();
                                });

                            })
                            .catch(function (error) {

                                Swal.fire(
                                    "Error",
                                    error.message || "Failed to remove item.",
                                    "error"
                                );

                            })
                            .finally(function () {

                                pendingItems.delete(itemId);
                                button.disabled = false;

                            });

                        });

                    });

                });

        });

        /*]]>*/
    </script>

</body>
</html>
