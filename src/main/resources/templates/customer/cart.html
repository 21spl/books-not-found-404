<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Your Cart</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <!-- After editing style.css -->
    <link rel="stylesheet" href="/resources/css/style.css?v=1.0.2">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha512-papcAxPZOkZLKFcV0iM6zzJzX/VCYqu7y7P+MmfQUqsmLSNKJVi2XScqYtQbnUmZUdOHF+xd9oZhxw50YdI0yQ=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.cdnfonts.com/css/segoe-ui-4"
          rel="stylesheet">

    <style>
        /* Neon border and shadow effect */
        .neon-box {
            border: 1px solid #9c27b0;
            box-shadow: 0 0 10px #9c27b0;
            border-radius: 10px;
        }

        /* Quantity Buttons */
        .btn-outline-secondary {
            color: #9c27b0;
            border-color: #9c27b0;
        }

        .btn-outline-secondary:hover {
            background-color: #9c27b0;
            color: #fff;
        }

        /* Success button for checkout */
        .btn-success {
            background-color: #9c27b0;
            border-color: #9c27b0;
        }

        .btn-success:hover {
            background-color: #7b1fa2;
        }

        /* Danger button for remove */
        .btn-danger {
            background-color: #c62828;
            border-color: #c62828;
        }

        .btn-danger:hover {
            background-color: #b71c1c;
        }

        .neon-border {
            border: 2px solid #a259ff;
            box-shadow: 0 0 10px #a259ff44, 0 0 20px #a259ff33;
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .neon-border:hover {
            box-shadow: 0 0 15px #a259ffaa, 0 0 30px #a259ff77;
        }

        .card:hover {
            transform: translateY(-5px);
            transition: transform 0.3s ease;
        }

        .btn-outline-light {
            border-color: #a259ff;
            color: #a259ff;
        }

        .btn-outline-light:hover {
            background-color: #a259ff;
            color: #fff;
        }

        h1 {
            font-family: 'Segoe UI';
            text-align: center;
            font-size: 60px;
            padding-top: 10px;
            padding-bottom: 30px;
            border-bottom: 2px solid #a259ff;
        }

        body {
            background-color: #000000;
            color: #fff;
            font-family: 'Segoe UI';
        }

        .btn-decrease,
        .btn-increase,
        .btn-delete-item,
        .btn-success {
            display: inline-block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
    </style>
</head>

<body style="background-color: #0d0d0d; color: #e0e0e0;">

    <!-- Navbar -->
    <div th:insert="fragments/navbar :: navbar"></div>

    <h1 class="mb-4 pt-4 pb-4 mt-4 mb-4">
        <span>
            <i class="fa-solid fa-cart-shopping"
               style="color: #ffffff;"></i>
        </span>
    </h1>

    <div class="container mt-4">

        <!-- Empty Cart Message -->
        <div id="empty-cart-message"
             th:style="${cartItems == null or #lists.isEmpty(cartItems)}
                        ? 'display: block;'
                        : 'display: none;'">

            <div class="alert alert-info"
                 style="font-size: 20px; text-align: center; font-weight: bold">
                Your Cart is Empty...
            </div>

        </div>

        <!-- Cart content -->
        <div id="cart-content"
             th:if="${cartItems != null and !#lists.isEmpty(cartItems)}">

            <!-- Cart cards -->
            <div class="row row-cols-1 row-cols-md-2 g-4"
                 id="cart-items-container">

                <div class="col cart-item-col"
                     th:each="item : ${cartItems}"
                     th:attr="data-item-id=${item.id},
                              data-unit-price=${item.book.price}">

                    <div class="card h-100 shadow neon-border bg-dark text-white">

                        <div class="card-body">

                            <h5 class="card-title"
                                th:text="${item.book.title}">
                            </h5>

                            <h6 class="card-subtitle mb-2 text-muted"
                                th:text="${item.book.author}">
                            </h6>

                            <p class="card-text item-price">
                                <strong>Price:</strong>
                                ₹<span th:text="${item.book.price}"></span>
                                <br>
                            </p>

                            <p class="card-text item-subtotal">
                                <strong>Total:</strong>
                                ₹<span class="item-subtotal-value"
                                       th:text="${item.quantity * item.book.price}"></span>
                            </p>

                            <!-- Quantity controls -->
                            <div class="d-flex align-items-center">

                                <button type="button"
                                        class="btn btn-sm btn-outline-light btn-decrease"
                                        th:attr="data-item-id=${item.id},
                                                 data-max=${item.book.copies}">
                                    −
                                </button>

                                <input type="text"
                                       th:id="'qty-' + ${item.id}"
                                       class="mx-3 form-control qty-input text-center"
                                       th:value="${item.quantity}"
                                       readonly>

                                <button type="button"
                                        class="btn btn-sm btn-outline-light btn-increase"
                                        th:attr="data-item-id=${item.id},
                                                 data-max=${item.book.copies}">
                                    +
                                </button>

                            </div>

                            <!-- Stock warning -->
                            <div class="text-danger small mt-2"
                                 th:if="${item.quantity > item.book.copies}">
                                Your cart quantity exceeds the displayed stock.
                                Please decrease the quantity before checkout.
                            </div>

                        </div>

                        <!-- Delete item from cart -->
                        <div class="card-footer border-top border-secondary d-flex justify-content-end">

                            <button type="button"
                                    class="btn btn-sm btn-outline-light btn-delete-item"
                                    th:attr="data-item-id=${item.id}">

                                <span>
                                    <i class="fa-solid fa-trash"></i>
                                </span>

                            </button>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Total Price -->
            <div class="mt-5 text-end">
                <h4>
                    Total Amount:
                    ₹<span id="cart-total"
                           th:text="${totalAmount}"></span>
                </h4>
            </div>

            <!-- Checkout Button -->
            <div class="text-end mt-3">

                <form th:action="@{/checkout}" method="get">

                    <button type="submit"
                            class="btn btn-success"
                            th:disabled="${hasOutOfStock}">
                        Proceed to Checkout
                    </button>

                </form>

            </div>

            <!-- Optional Warnings (global) -->
            <div th:if="${outOfStockWarnings != null and !#lists.isEmpty(outOfStockWarnings)}"
                 class="alert alert-danger mt-3">

                <ul class="mb-0">
                    <li th:each="msg : ${outOfStockWarnings}"
                        th:text="${msg}">
                    </li>
                </ul>

            </div>

        </div>

    </div>

    <!-- Footer -->
    <div class="footer text-center">
        &copy; 2025 404BooksNotFound &nbsp;|&nbsp; Built with irony, styled with restraint.
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/752b42e49f.js" crossorigin="anonymous"></script>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="text/javascript" th:inline="javascript">
        /*<![CDATA[*/

        document.addEventListener("DOMContentLoaded", function () {

            const csrfTokenElement =
                document.querySelector('meta[name="_csrf"]');

            const csrfHeaderElement =
                document.querySelector('meta[name="_csrf_header"]');

            const csrfToken = csrfTokenElement
                ? csrfTokenElement.content
                : null;

            const csrfHeader = csrfHeaderElement
                ? csrfHeaderElement.content
                : null;

            /*
             * Keep track of items with an operation in progress.
             * This prevents duplicate requests for the same item.
             */
            const pendingItems = new Set();

            const cartContent = document.getElementById("cart-content");
            const emptyCartMessage =
                document.getElementById("empty-cart-message");

            /*
             * Send a POST request using the existing controller endpoints.
             * The server remains responsible for validating the operation.
             */
            async function postRequest(url, data) {

                const headers = {
                    "Content-Type": "application/x-www-form-urlencoded"
                };

                if (csrfToken && csrfHeader) {
                    headers[csrfHeader] = csrfToken;
                }

                const body = new URLSearchParams(data).toString();

                const response = await fetch(url, {
                    method: "POST",
                    headers: headers,
                    body: body
                });

                const responseText = await response.text();

                if (!response.ok) {
                    throw new Error(
                        responseText || "The request could not be completed."
                    );
                }

                return responseText;
            }

            /*
             * Format amounts consistently to two decimal places.
             */
            function formatAmount(amount) {
                return amount.toFixed(2);
            }

            /*
             * Recalculate the total from the quantities currently displayed.
             *
             * This also handles rollback after a failed request and prevents
             * one item's rollback from overwriting another item's total.
             */
            function recalculateCartTotal() {

                const totalElement = document.getElementById("cart-total");

                if (!totalElement || !cartContent) {
                    return;
                }

                let total = 0;

                document.querySelectorAll(".cart-item-col")
                    .forEach(function (card) {

                        const unitPrice = Number(
                            card.getAttribute("data-unit-price")
                        );

                        const itemId = card.getAttribute("data-item-id");

                        const quantityInput = document.getElementById(
                            "qty-" + itemId
                        );

                        if (quantityInput && Number.isFinite(unitPrice)) {
                            const quantity = Number(quantityInput.value) || 0;
                            total += unitPrice * quantity;
                        }

                    });

                totalElement.textContent = formatAmount(total);
            }

            /*
             * Update an individual item's displayed subtotal.
             */
            function updateItemSubtotal(card, quantity) {

                const unitPrice = Number(
                    card.getAttribute("data-unit-price")
                );

                const subtotalElement =
                    card.querySelector(".item-subtotal-value");

                if (!subtotalElement || !Number.isFinite(unitPrice)) {
                    return;
                }

                subtotalElement.textContent =
                    formatAmount(unitPrice * quantity);
            }

            /*
             * Find all quantity controls belonging to one item.
             */
            function getQuantityButtons(itemId) {

                return document.querySelectorAll(
                    '.btn-decrease[data-item-id="' + itemId + '"], ' +
                    '.btn-increase[data-item-id="' + itemId + '"]'
                );
            }

            /*
             * Enable or disable the quantity controls for one item.
             */
            function setQuantityButtonsDisabled(itemId, disabled) {

                getQuantityButtons(itemId).forEach(function (button) {
                    button.disabled = disabled;
                });
            }

            /*
             * Display a short success message without blocking the page.
             */
            function showSuccessToast(title) {

                Swal.fire({
                    toast: true,
                    position: "top-end",
                    icon: "success",
                    title: title,
                    showConfirmButton: false,
                    timer: 1600,
                    timerProgressBar: true
                });
            }

            /*
             * Update the quantity.
             *
             * IMPORTANT:
             * 1. Update the UI immediately.
             * 2. Send the request to the server.
             * 3. Keep the change if successful.
             * 4. Restore the previous quantity if rejected.
             *
             * No page reload is performed.
             */
            async function updateQuantity(itemId, newQuantity, input) {

                if (pendingItems.has(itemId)) {
                    return;
                }

                const card = input.closest(".cart-item-col");

                if (!card) {
                    return;
                }

                const oldQuantity = Number(input.value);

                if (!Number.isInteger(newQuantity) || newQuantity < 1) {
                    return;
                }

                if (newQuantity === oldQuantity) {
                    return;
                }

                pendingItems.add(itemId);
                setQuantityButtonsDisabled(itemId, true);

                /*
                 * Optimistic UI update:
                 * these changes appear immediately, without waiting
                 * for the server's response.
                 */
                input.value = newQuantity;

                updateItemSubtotal(card, newQuantity);
                recalculateCartTotal();

                try {

                    await postRequest(
                        /*[[@{/cart/update}]]*/ "/cart/update",
                        {
                            itemId: itemId,
                            quantity: newQuantity
                        }
                    );

                    /*
                     * Do not reload the page after success.
                     * The updated values are already visible.
                     */

                } catch (error) {

                    /*
                     * The server rejected the change.
                     * Restore the old quantity and calculate the totals again.
                     */
                    input.value = oldQuantity;

                    updateItemSubtotal(card, oldQuantity);
                    recalculateCartTotal();

                    Swal.fire({
                        title: "Unable to Update Quantity",
                        text: error.message || "Failed to update quantity.",
                        icon: "error",
                        confirmButtonColor: "#9c27b0"
                    });

                } finally {

                    pendingItems.delete(itemId);
                    setQuantityButtonsDisabled(itemId, false);

                }
            }

            /*
             * Increase quantity.
             */
            document.querySelectorAll(".btn-increase")
                .forEach(function (button) {

                    button.addEventListener("click", function () {

                        const itemId =
                            this.getAttribute("data-item-id");

                        if (pendingItems.has(itemId)) {
                            return;
                        }

                        const input = document.getElementById(
                            "qty-" + itemId
                        );

                        if (!input) {
                            return;
                        }

                        const max = Number(
                            this.getAttribute("data-max")
                        );

                        const current = Number(input.value) || 1;

                        if (!Number.isFinite(max) || max < 0) {

                            Swal.fire({
                                title: "Stock Unavailable",
                                text: "Unable to determine the displayed stock.",
                                icon: "error",
                                confirmButtonColor: "#9c27b0"
                            });

                            return;
                        }

                        if (current >= max) {

                            Swal.fire({
                                title: "Stock Limit",
                                text: "The requested quantity cannot exceed the displayed stock. Actual availability is validated by the server.",
                                icon: "warning",
                                confirmButtonColor: "#9c27b0"
                            });

                            return;
                        }

                        updateQuantity(itemId, current + 1, input);

                    });

                });

            /*
             * Decrease quantity.
             */
            document.querySelectorAll(".btn-decrease")
                .forEach(function (button) {

                    button.addEventListener("click", function () {

                        const itemId =
                            this.getAttribute("data-item-id");

                        if (pendingItems.has(itemId)) {
                            return;
                        }

                        const input = document.getElementById(
                            "qty-" + itemId
                        );

                        if (!input) {
                            return;
                        }

                        const current = Number(input.value) || 1;

                        if (current > 1) {
                            updateQuantity(itemId, current - 1, input);
                        }

                    });

                });

            /*
             * Remove an item from the cart.
             *
             * The card disappears immediately after confirmation.
             * If the server rejects the request, restore the card
             * to its original position.
             *
             * No page reload is performed.
             */
            document.querySelectorAll(".btn-delete-item")
                .forEach(function (button) {

                    button.addEventListener("click", function () {

                        const itemId =
                            this.getAttribute("data-item-id");

                        if (pendingItems.has(itemId)) {
                            return;
                        }

                        const card = button.closest(".cart-item-col");

                        if (!card) {
                            return;
                        }

                        Swal.fire({
                            title: "Are you sure?",
                            text: "Do you want to remove this item from cart?",
                            icon: "warning",
                            showCancelButton: true,
                            confirmButtonColor: "#9c27b0",
                            cancelButtonColor: "#c62828",
                            confirmButtonText: "Yes, remove it!"
                        }).then(async function (result) {

                            if (!result.isConfirmed) {
                                return;
                            }

                            pendingItems.add(itemId);
                            button.disabled = true;

                            /*
                             * Save the card's position so we can restore it
                             * if the server rejects the deletion.
                             */
                            const placeholder =
                                document.createComment("cart-item-placeholder");

                            card.parentNode.insertBefore(placeholder, card);

                            /*
                             * Optimistically remove the card immediately.
                             */
                            card.remove();

                            recalculateCartTotal();

                            /*
                             * If no cards remain, display the empty-cart message.
                             */
                            const remainingCards =
                                document.querySelectorAll(".cart-item-col").length;

                            if (remainingCards === 0) {

                                if (cartContent) {
                                    cartContent.style.display = "none";
                                }

                                if (emptyCartMessage) {
                                    emptyCartMessage.style.display = "block";
                                }

                            }

                            try {

                                await postRequest(
                                    /*[[@{/cart/remove}]]*/ "/cart/remove",
                                    {
                                        itemId: itemId
                                    }
                                );

                                /*
                                 * The server confirmed deletion.
                                 * The card is already gone.
                                 */
                                placeholder.remove();

                                showSuccessToast("Item removed from cart");

                            } catch (error) {

                                /*
                                 * The deletion failed.
                                 * Restore the card to its original position.
                                 */
                                placeholder.parentNode?.insertBefore(
                                    card,
                                    placeholder
                                );

                                placeholder.remove();

                                if (cartContent) {
                                    cartContent.style.display = "";
                                }

                                if (emptyCartMessage) {

                                    const cardsNow =
                                        document.querySelectorAll(
                                            ".cart-item-col"
                                        ).length;

                                    emptyCartMessage.style.display =
                                        cardsNow === 0 ? "block" : "none";

                                }

                                recalculateCartTotal();

                                Swal.fire({
                                    title: "Unable to Remove Item",
                                    text: error.message || "Failed to remove item.",
                                    icon: "error",
                                    confirmButtonColor: "#9c27b0"
                                });

                            } finally {

                                pendingItems.delete(itemId);
                                button.disabled = false;

                            }

                        });

                    });

                });

        });

        /*]]>*/
    </script>

</body>
</html>
